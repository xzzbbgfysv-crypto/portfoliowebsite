<!DOCTYPE html>
<body>
    <a href="index.html" style="color:rgb(255, 255, 255); text-decoration:underline; font-family:courier; font-size:28px; padding-top: 40px; padding-left: 40px;">home</a>
    <h1 style="text-align: center; font-family:courier; font-size:36px; color:rgb(31, 58, 166);">kayaking</h1>
<style>
    body {
        background-image: url('images/kayakbg.jpeg');
        background-size: 100%;
        background-attachment: fixed;
        margin: 0;

    }

    .container {
        display: flex;
        align-items:center; /* vertical centering */
        gap: 30px; /* space between image and text */
        width: 1000px;
        margin: 40px auto; /* even spacing between rows */
        transition: filter 0.5s ease;
    }

    .container img {
        width: 600px;
        border-radius: 8px;
        padding: 0px;
        border: 5px solid rgb(0, 0, 0);
        border-radius: 5px;
        transition: transform 0.5s ease;
    }

    .container:hover img {
        transform: scale(1.08);
    }

    body:has(.container:hover) .container  {
        filter: blur(4px) brightness(0.6);
    }

    body:has(.container:hover) .container:hover {
        filter: blur(0px) brightness(1);
    }

    .text {
        font-family: courier;
        font-size: 16px;
        color: rgb(255, 255, 255);
        max-width: 350px;
        padding-top: 10px;;
    }

    .text h2 {
        margin: 0 0 10px 0;
    }
</style>
</head>

<body style="justify-content: left;">

<div class="container" style="padding-left:40px;">
    <img src="images/kayak.jpeg" alt="kayak">
    <div class="text">
        <h2>split sunset</h2>
        <p>eggomoggin reach, brooklin</p>
    </div>
</div>

<div class="container"; style="padding-left:40px;">

</div>

    <img src="images/kayak2.jpeg" alt="kayak2">

        <h2>leaning spruce</h2>
        <p>hogg island</p>
    </div>
</div>

<div class="container" style="padding-left:40px;">
    <img src="images/kayak3.jpeg" alt="kayak3">
    <div class="text">
        <h2>sunset break</h2>
